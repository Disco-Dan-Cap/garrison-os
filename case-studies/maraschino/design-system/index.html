<script>
/* Opened on its own rather than inside GARRISON OS: go to the desktop with the Maraschino case study
   and this window open on top of it. ?solo keeps it standalone (for checking the page by itself). */
(function(){
  var framed; try { framed = window.self !== window.top; } catch(e){ framed = true; }
  if (!framed && !/[?&]solo\b/.test(location.search)) location.replace('/#maraschino/design-system' + (location.hash ? '/' + location.hash.slice(1) : ''));
})();
</script>

<body>
<div class="ds" id="ds">
  <aside class="ds-side" id="ds-side" aria-label="Design system">
    <div class="ds-brand">
      <span class="ds-brand-mark" aria-hidden="true" id="ds-mark"></span>
      <span class="ds-brand-name">Maraschino</span>
      <span class="ds-brand-sub">Design system</span>
      <button type="button" class="ds-menu-btn" id="ds-menu-btn" aria-expanded="false" aria-controls="ds-nav" aria-label="Sections"></button>
    </div>
    <div class="ds-search">
      <label class="ds-search-box">
        <span class="ds-search-ico" aria-hidden="true" id="ds-search-ico"></span>
        <input id="ds-q" type="search" autocomplete="off" spellcheck="false" placeholder="Search tokens, parts…" aria-label="Search the design system" aria-controls="ds-results" aria-expanded="false">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="ds-results" id="ds-results" role="listbox" hidden></div>
    </div>
    <nav class="ds-nav" id="ds-nav" aria-label="Sections"></nav>
    <div class="ds-side-foot" id="ds-side-foot"></div>
  </aside>
  <main class="ds-main" id="ds-main" tabindex="-1">
    <div class="ds-view" id="ds-view" aria-live="polite"></div>
  </main>
  <div class="ds-toast" id="ds-toast" role="status" aria-live="polite"></div>
